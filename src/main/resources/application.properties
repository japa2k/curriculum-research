spring.application.name=curriculum-research

spring.config.import=optional:file:.env[.properties]

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=aetherJPjobs_bot
telegram.chat.id=${TELEGRAM_CHAT_ID}

# SQLite allows a single writer, so the pool keeps one connection.
spring.datasource.url=jdbc:sqlite:jobs.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

# Scheduled job search: every 6 hours, pausing between queries so LinkedIn does not rate-limit us.
# It only stores the jobs; the delivery below sends them. LinkedIn ignores "Brasil" and searches
# worldwide, so the location must be the English name.
jobs.search.cron=0 0 */6 * * *
jobs.search.location=Brazil
jobs.search.pause=3s

# Job delivery: every 30 minutes, the 5 oldest stored jobs not sent yet go to the chat.
jobs.delivery.cron=0 */30 * * * *
jobs.delivery.batch-size=5

# A search takes minutes; a second scheduler thread keeps it from delaying the delivery.
spring.task.scheduling.pool.size=2

# Each job sent opens the local Claude Code CLI once, which writes a study plan and a résumé
# tailored to the job from the base résumé; both go to the chat as PDFs and stay in applications.dir.
# The base résumé holds contact data, so it lives under the git-ignored data/ folder.
resume.base-path=data/curriculo-base.html
applications.dir=data/applications
claude.command=claude
claude.timeout=5m
study-plan.weekly-hours=10
study-plan.max-weeks=8
