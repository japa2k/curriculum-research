# Search profile used by GET /api/jobs/recommendations and GET /api/jobs/{id}/study-plan.
# Seeded by hand from the engineer's résumé. Skills and preferences only: never put contact data here.
#
# knownSkills      dictionary names the engineer already has (each must exist in skillDictionary)
# skillDictionary  every skill the matcher can detect; a posting's detected skills that are not in
#                  knownSkills become its missingSkills. Matching is whole-word and case-insensitive
#                  unless caseSensitive: true (use it for names that are also common words).
# searches         one LinkedIn search per (search × location) pair, at most 24 pairs in total.
#                  Track CORE = a role the résumé already covers; any other track is an adjacent role.
# studyPlan        the budget every generated study plan must fit.

knownSkills:
  # Frontend
  - React
  - Next.js
  - TypeScript
  - JavaScript
  - Tailwind CSS
  - Radix UI
  - Zustand
  - TanStack Query
  - React Hook Form
  - Zod
  - Tiptap
  # Backend
  - Node.js
  - NestJS
  - Express
  - Java
  - Spring Boot
  - Spring Security
  - Spring Cloud
  - Python
  - Django
  - REST
  - PostgreSQL
  - SQL
  - Prisma
  - Hibernate
  - Flyway
  - Kafka
  - Redis
  - Microservices
  - JWT
  - OAuth
  - RBAC
  - Jest
  - JUnit
  - OpenAPI
  - Webhooks
  # Infrastructure
  - Docker
  - CI/CD
  - GitHub Actions
  - Git
  - Cloudflare Workers
  - Amazon S3
  # AI
  - LLM

